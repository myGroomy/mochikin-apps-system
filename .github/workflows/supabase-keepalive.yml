name: Supabase Free Tier Keepalive

on:
  schedule:
    # Berjalan setiap 3 hari sekali pukul 04:00 UTC (11:00 WIB)
    - cron: '0 4 */3 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Keepalive Endpoint
        env:
          APP_URL: ${{ secrets.MYPERFORMANCE_URL || 'https://myperformance.mochikin.id' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET || 'dev-cron-secret' }}
        run: |
          echo "Sending keepalive ping to Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL}/api/cron/keepalive" || echo "FAILED")
          echo "Keepalive HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "401" ] || [ "$HTTP_STATUS" = "404" ]; then
            echo "Keepalive ping executed."
          else
            echo "Warning: Keepalive returned $HTTP_STATUS"
          fi
