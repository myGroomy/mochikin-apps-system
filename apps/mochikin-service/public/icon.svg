<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- MOCHIKIN SERVICE Icon Badge: Sleek rounded square in warm amber-orange #F59E0B with clean white hub/connector shape -->
  <rect width="512" height="512" rx="120" fill="#F59E0B"/>
  <g>
    <!-- Connector lines -->
    <path d="M256 256 L256 160 M256 256 L170 330 M256 256 L342 330" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>
    <!-- Central hub node -->
    <circle cx="256" cy="256" r="36" fill="#FFFFFF"/>
    <!-- Satellite connector nodes -->
    <circle cx="256" cy="160" r="32" fill="#FFFFFF"/>
    <circle cx="170" cy="330" r="32" fill="#FFFFFF"/>
    <circle cx="342" cy="330" r="32" fill="#FFFFFF"/>
  </g>
</svg>
