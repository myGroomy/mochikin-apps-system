<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <!-- MOCHIKIN SERVICE Logo: Icon Badge + Wordmark -->
  <g>
    <!-- Rounded square badge in warm amber-orange #F59E0B -->
    <rect x="8" y="8" width="64" height="64" rx="16" fill="#F59E0B" />
    <!-- White abstract hub/connector shape -->
    <path d="M40 40 L40 25 M40 40 L27 51 M40 40 L53 51" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
    <circle cx="40" cy="40" r="5" fill="#FFFFFF"/>
    <circle cx="40" cy="25" r="4" fill="#FFFFFF"/>
    <circle cx="27" cy="51" r="4" fill="#FFFFFF"/>
    <circle cx="53" cy="51" r="4" fill="#FFFFFF"/>
  </g>
  <!-- Wordmark "MYSERVICE" in dark amber #D97706 -->
  <text x="86" y="50" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DM Sans', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.02em" fill="#D97706">MYSERVICE</text>
</svg>
